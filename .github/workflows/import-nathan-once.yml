name: Import Nathan Quipus once

on:
  push:
    branches: [sync/nathan-waveshare-20261021]
    paths:
      - .github/workflows/import-nathan-once.yml
      - .codex-import/nathan-waveshare.patch

permissions:
  contents: write

concurrency:
  group: quipus-nathan-import-20261021
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'jinchuntan/quipus' && github.event.head_commit.message == 'Prepare Nathan Quipus import'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_SHA: d36b54dfc480876063b45c23f697d04a35697930
      PREVIOUS_MAIN: 1fa53c5d7546d3cabf105f55cc2665c481a65b8f
      EXPECTED_TREE: 76060d80b2245813d415a30dafb2c94d76b3344e
      IMPORT_BRANCH: sync/nathan-waveshare-20261021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble the pinned upstream snapshot with retained history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_MAIN"
          cp .codex-import/nathan-waveshare.patch "$RUNNER_TEMP/nathan-waveshare.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/NathanHor22/Quipus.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git merge --no-commit --allow-unrelated-histories -s ours "$UPSTREAM_SHA"
          git read-tree --reset -u "$UPSTREAM_SHA"
          git apply --index "$RUNNER_TEMP/nathan-waveshare.patch"
          git diff --cached --check "$UPSTREAM_SHA"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(cat .git/MERGE_HEAD)" = "$UPSTREAM_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify firmware board and Wi-Fi setup behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-firmware-boards.py
          cc -std=c11 -O1 -Wall -Wextra -Werror \
            -I hardware/lantern-firmware/main \
            hardware/lantern-firmware/main/quipus_network_policy.c \
            hardware/lantern-firmware/main/quipus_setup_form.c \
            hardware/lantern-firmware/tests/network_policy_test.c \
            -o "$RUNNER_TEMP/network-policy-test"
          "$RUNNER_TEMP/network-policy-test"

      - name: Verify the imported application
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/security-scan.mjs
          npm run typecheck
          node --import tsx --test --test-concurrency=4 tests/*.test.ts

      - name: Publish the verified import branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git commit -m "Import Nathan Quipus and add Waveshare LCD 1.54 firmware" \
            -m "Import NathanHor22/Quipus at $UPSTREAM_SHA with its Git history retained as a merge parent. Preserve the previous prototype in history and on backup/pre-nathan-import-20261021." \
            -m "Add the tested Waveshare firmware profile and document iPhone Wi-Fi setup, deployment boundaries and future upstream merges."
          test "$(git rev-parse HEAD^2)" = "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$IMPORT_BRANCH"
          {
            echo '## Quipus import complete'
            echo "Imported upstream commit: $UPSTREAM_SHA"
            echo "Published import commit: $(git rev-parse HEAD)"
            echo "Verified tree: $EXPECTED_TREE"
            echo 'The default branch and prototype backup were preserved.'
          } >> "$GITHUB_STEP_SUMMARY"
